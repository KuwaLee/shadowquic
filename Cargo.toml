[workspace]
members = ["shadowquic", "shadowquic-macros","perf"]
default-members = ["shadowquic"]
resolver = "3"


[workspace.package]
version = "0.4.14"
edition = "2024"
authors = ["spongebob888"]
categories = ["proxy", "quic"]
keywords = ["quic", "sni"]
homepage = "https://github.com/spongebob888/shadowquic"
repository = "https://github.com/spongebob888/shadowquic.git"
description = "A 0-RTT QUIC Proxy with SNI camouflage"
license = "MIT"
readme = "README.md"
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true

[workspace.dependencies]

# ShadowQUIC's Brutal needs quinn-jls congestion controllers that can set the
# pacing rate, count lost packets and keep their state on a new path. Use
# quinn-jls 0.4.1 with these hooks until a release includes them.
[patch.crates-io]
quinn-jls = { git = "https://github.com/KuwaLee/quinn-jls", branch = "feat/controller-pacing-rate" }
quinn-proto-jls = { git = "https://github.com/KuwaLee/quinn-jls", branch = "feat/controller-pacing-rate" }
quinn-udp-jls = { git = "https://github.com/KuwaLee/quinn-jls", branch = "feat/controller-pacing-rate" }
