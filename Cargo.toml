[workspace]
members = ["shadowquic", "shadowquic-macros","perf"]
default-members = ["shadowquic"]
resolver = "3"


[workspace.package]
version = "0.4.14"
edition = "2024"
authors = ["spongebob888"]
categories = ["proxy", "quic"]
keywords = ["quic", "sni"]
homepage = "https://github.com/spongebob888/shadowquic"
repository = "https://github.com/spongebob888/shadowquic.git"
description = "A 0-RTT QUIC Proxy with SNI camouflage"
license = "MIT"
readme = "README.md"
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true

[workspace.dependencies]

# quinn-jls 0.4.0 can deadlock a connection when the peer stops a stream while
# the connection-level write limit is zero. Use a quinn-jls build synced with
# upstream quinn main (quinn-rs/quinn#2834) until a fixed release is published.
[patch.crates-io]
quinn-jls = { git = "https://github.com/KuwaLee/quinn-jls", branch = "fix/stop-sending" }
quinn-proto-jls = { git = "https://github.com/KuwaLee/quinn-jls", branch = "fix/stop-sending" }
quinn-udp-jls = { git = "https://github.com/KuwaLee/quinn-jls", branch = "fix/stop-sending" }
